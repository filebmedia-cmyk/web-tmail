<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - CYBER MAIL OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Particles Background -->
    <div id="particles-js"></div>

    <div class="top-nav">
        <a href="index.html">RETURN_TO_CORE</a>
    </div>

    <!-- Login Gate Screen (Shared logic or just check session) -->
    <div id="login-screen">
        <div class="container">
            <div class="terminal-top-bar">
                <div class="terminal-dots">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="terminal-title">This Flatimo</div>
            </div>
            <div class="header">
                <h1 class="glitch">ADMIN.AUTH</h1>
                <p>ACCESS CODE REQUIRED</p>
            </div>
            <div class="form-group">
                <input type="password" id="access-code" placeholder="ENTER CDK..." autocomplete="off">
            </div>
            <button class="btn-primary" id="btn-login">AUTHORIZE</button>
            <p id="login-error" style="color: var(--neon-pink); display: none; text-align: center; margin-top: 10px;">ACCESS DENIED.</p>
        </div>
    </div>

    <!-- Main Admin Screen -->
    <div id="main-screen" class="hidden">
        <div class="container">
            <div class="terminal-top-bar">
                <div class="terminal-dots">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="terminal-title">This Flatimo</div>
            </div>
            <div class="header glitch-wrapper">
                <h1 class="glitch">DOMAIN_CTRL</h1>
                <p>MANAGE ALLOWED DOMAINS_</p>
            </div>
            
            <div class="form-group">
                <label>Add New Domain</label>
                <div class="input-row">
                    <input type="text" id="new-domain" placeholder="e.g. newdomain.com" autocomplete="off">
                    <button class="btn-secondary" id="btn-add" style="margin-top: 0; width: auto;">ADD</button>
                </div>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>DOMAIN</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="domain-list">
                    <!-- Populated by JS -->
                </tbody>
            </table>
            
            <button class="btn-secondary" id="btn-reset" style="margin-top: 2rem;">RESET TO DEFAULT</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
